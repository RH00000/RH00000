<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Richard Huang — Software Engineering, Machine Learning, Applied Mathematics" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E7EB" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="#FFFFFF"/>
  <rect width="1200" height="280" fill="url(#grid-light)"/>

  <!-- sparse network motif, right side -->
  <g stroke="#3454D1" stroke-width="1.2" opacity="0.35" fill="none">
    <line x1="880" y1="70" x2="960" y2="110"/>
    <line x1="960" y1="110" x2="940" y2="190"/>
    <line x1="960" y1="110" x2="1050" y2="95"/>
    <line x1="1050" y1="95" x2="1120" y2="150"/>
    <line x1="940" y1="190" x2="1030" y2="205"/>
    <line x1="1030" y1="205" x2="1120" y2="150"/>
  </g>
  <g fill="#3454D1" opacity="0.55">
    <circle cx="880" cy="70" r="3.5"/>
    <circle cx="960" cy="110" r="3.5"/>
    <circle cx="1050" cy="95" r="3.5"/>
    <circle cx="940" cy="190" r="3.5"/>
    <circle cx="1120" cy="150" r="3.5"/>
    <circle cx="1030" cy="205" r="3.5"/>
  </g>

  <!-- name + descriptor -->
  <text x="80" y="140" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="1" fill="#111827">RICHARD HUANG</text>
  <text x="80" y="178" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" letter-spacing="0.5" fill="#3454D1">Software Engineering · Machine Learning · Applied Mathematics</text>

  <line x1="80" y1="205" x2="200" y2="205" stroke="#111827" stroke-width="2"/>
</svg>
